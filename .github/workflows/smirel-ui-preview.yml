name: Smirel UI Preview
# Synced from main for visual review.

on:
  push:
    branches:
      - release/smirel-ui-next
    paths:
      - 'frontend/**'
      - '.github/workflows/smirel-ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: smirel-ui-preview-pages
  cancel-in-progress: false

jobs:
  preview:
    environment:
      name: smirel-ui-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Preview is intentionally a visual fast path. Typecheck, critical Vitest,
      # and the full standalone build continue to run in the normal CI workflow
      # in parallel, so they do not block visual review.
      - name: Build preview bundle
        run: |
          pnpm exec vite build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
        env:
          VITE_STANDALONE: 'true'
          VITE_SMIREL_STANDALONE: 'true'
          VITE_UI_PREVIEW: 'true'
          VITE_PUBLIC_BASE: '/termrelay/'
          # Preview must never send authenticated UI actions to production.
          VITE_API_BASE_URL: '/termrelay/__preview_api__'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
